name: CI

# Valida cada PR y cada push a develop y main con `npm run verify:all`.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # El mismo comando que se corre en local: tipos, lint, pruebas (incluye las de gobierno de
      # src/__governance__), build de la librería y build de Storybook.
      - run: npm run verify:all
