name: Release

# Al subir un tag de versión (vX.Y.Z) que esté en main: verifica y crea el GitHub Release.
# Publica en npm solo si existe el secret NPM_TOKEN y la versión aún no está publicada;
# si se publica a mano (npm publish con 2FA), este paso se omite.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # crear el GitHub Release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: El tag debe estar en main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "El tag ${GITHUB_REF_NAME} no está en main. Solo se publica lo validado en main."; exit 1; }
      - name: La versión del tag coincide con package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          [ "$PKG" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} ≠ package.json ${PKG}"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run verify
      - name: ¿Publicar en npm?
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ -z "$NPM_TOKEN" ]; then
            echo "Sin NPM_TOKEN: la publicación se hace a mano." && echo "publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "@canek-ui/material-design-system@${VERSION}" version >/dev/null 2>&1; then
            echo "La versión ${VERSION} ya está en npm." && echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar en npm
        if: steps.npm.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Notas del release desde CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
      - name: Crear GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
